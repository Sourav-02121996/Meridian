<!DOCTYPE html>
<html>
<head><title>Submission response fixture</title></head>
<body>
  <form id="app-form">
    <label for="first_name">First Name</label>
    <input id="first_name" name="first_name" type="text" required />

    <label for="last_name">Last Name</label>
    <input id="last_name" name="last_name" type="text" required />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required />

    <label for="resume">Resume</label>
    <input id="resume" name="resume" type="file" required />

    <button type="button" id="submit-btn">Submit Application</button>
  </form>
  <script>
    document.getElementById('submit-btn').addEventListener('click', function () {
      fetch('https://ats.test/application/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ operationName: 'ApplicationFormSubmit' }),
      });
    });
  </script>
</body>
</html>
