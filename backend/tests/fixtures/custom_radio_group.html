<!DOCTYPE html>
<html>
<head><title>Application with one custom radio group</title></head>
<body>
  <form id="app-form">
    <label for="first_name">First Name</label>
    <input id="first_name" name="first_name" type="text" required />

    <label for="last_name">Last Name</label>
    <input id="last_name" name="last_name" type="text" required />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required />

    <label for="resume">Resume</label>
    <input id="resume" name="resume" type="file" required />

    <fieldset class="field" id="hear_about">
      <legend>How did you hear about us?</legend>
      <label><input type="radio" name="hear_about" value="linkedin" required /> LinkedIn</label>
      <label><input type="radio" name="hear_about" value="referral" required /> Referral</label>
      <label><input type="radio" name="hear_about" value="other" required /> Other</label>
    </fieldset>

    <button
      type="button"
      id="submit-btn"
      onclick="document.getElementById('confirmation').textContent = 'Thank you for applying!';"
    >Submit Application</button>
    <div id="confirmation"></div>
  </form>
</body>
</html>
