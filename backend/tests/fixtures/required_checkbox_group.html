<!DOCTYPE html>
<html>
<head><title>A "select all that apply" group marking every checkbox required</title></head>
<body>
  <!-- Reproduces the exact shape confirmed live on Greenhouse: a "select all that
       apply" checkbox group where *every* option carries its own `required`
       attribute, not just the group as a whole. Native HTML5 has no way to
       express "at least one of these N checkboxes" -- only "this specific one
       must be checked" -- so correctly checking just one and leaving the rest
       unchecked (the common, correct case) still leaves every unchecked sibling
       natively :invalid forever. See fields.py's count_genuinely_invalid, which
       excuses exactly this shape rather than treating it as a broken form. -->
  <form id="app-form">
    <label for="first_name">First Name</label>
    <input id="first_name" name="first_name" type="text" required />

    <label for="last_name">Last Name</label>
    <input id="last_name" name="last_name" type="text" required />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required />

    <label for="resume">Resume</label>
    <input id="resume" name="resume" type="file" required />

    <fieldset id="platforms">
      <legend>Which platforms have you used?</legend>
      <label><input type="checkbox" id="platform_tiktok" name="platform[]" required /> TikTok</label>
      <label><input type="checkbox" id="platform_instagram" name="platform[]" required /> Instagram</label>
      <label><input type="checkbox" id="platform_youtube" name="platform[]" required /> YouTube</label>
    </fieldset>

    <button
      type="button"
      id="submit-btn"
      onclick="document.getElementById('confirmation').textContent = 'Thank you for applying!';"
    >Submit Application</button>
    <div id="confirmation"></div>
  </form>
</body>
</html>
