<!DOCTYPE html>
<html>
<head><title>A fully-answered form with one leftover hidden validation proxy</title></head>
<body>
  <!-- Reproduces the exact shape confirmed live on Greenhouse: a custom
       react-select-style widget backs its own native validity with a hidden,
       id-less/name-less <input required aria-hidden="true" tabindex="-1">
       purely to hook into the browser's native constraint-validation API. This
       proxy can still show up :invalid even once every real, answerable field
       on the page is correctly filled -- and since it has no id/name, neither
       this code nor a human could ever target it directly. See fields.py's
       count_genuinely_invalid. -->
  <form id="app-form">
    <label for="first_name">First Name</label>
    <input id="first_name" name="first_name" type="text" required />

    <label for="last_name">Last Name</label>
    <input id="last_name" name="last_name" type="text" required />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required />

    <label for="resume">Resume</label>
    <input id="resume" name="resume" type="file" required />

    <input required aria-hidden="true" tabindex="-1" value="" />

    <button
      type="button"
      id="submit-btn"
      onclick="document.getElementById('confirmation').textContent = 'Thank you for applying!';"
    >Submit Application</button>
    <div id="confirmation"></div>
  </form>
</body>
</html>
