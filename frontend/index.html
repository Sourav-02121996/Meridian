<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Meridian matches your resume against real job postings, scores every role, and highlights the gaps worth addressing before you apply."
    />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <title>Meridian</title>
    <!-- Preconnecting (and loading fonts via <link> instead of a CSS @import, which the
         browser can't discover until it's already parsed the stylesheet) starts the font
         fetch as early as possible, cutting the fallback-to-webfont reflow that was
         showing up as layout shift. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    />
    <script>
      // Applied before the app mounts so there's no flash of the wrong theme.
      (function () {
        var stored = localStorage.getItem('meridian-theme');
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
